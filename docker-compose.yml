version: "3.8"

networks:
  microstack-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:

services:
  # API网关
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
        BASE_IMAGE: microstack-base:latest
    container_name: microstack-api-gateway
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - PORT=8080
    depends_on:
      - redis
      - mongodb
    networks:
      - microstack-network
    restart: unless-stopped

  # 用户服务
  user-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: user-service
        BASE_IMAGE: microstack-base:latest
    container_name: microstack-user-service
    ports:
      - "8081:8081"
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - PORT=8081
    depends_on:
      - mongodb
      - redis
    networks:
      - microstack-network
    restart: unless-stopped

  # 示例服务
  example-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: example-service
        BASE_IMAGE: microstack-base:latest
    container_name: microstack-example-service
    ports:
      - "8082:8082"
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - PORT=8082
    networks:
      - microstack-network
    restart: unless-stopped

  # MongoDB数据库
  mongodb:
    image: mongo:6.0
    container_name: microstack-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db
    networks:
      - microstack-network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: microstack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microstack-network
    restart: unless-stopped
    command: redis-server --appendonly yes

